=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>", "edit": "<path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/>", "trash": "<path d=\"M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14\"/>", "check": "<path d=\"M20 6 9 17l-5-5\"/>", "pause": "<path d=\"M9 5v14M15 5v14\"/>", "play": "<path d=\"M7 4l13 8-13 8z\"/>", "alert": "<path d=\"M12 3 2 21h20z\"/><path d=\"M12 10v5M12 18h.01\"/>", "download": "<path d=\"M12 3v12M7 10l5 5 5-5M4 21h16\"/>"};

let mem=null,priv=false,view="dash",opFilter="all",opType="all",posFilter="all",opQ="",dateF="all",dFrom="",dTo="",posDate="",tagF="",curAsset=null,imp0=null;

  ids.forEach(id=>{if(!D.plans.some(p=>p.asset===id&&p.broker=="MyInvestor"))D.plans.push({id:uid(),asset:id,broker:"MyInvestor",amount:100,day:31,every:1,start:"2026-10-29",active:true,done:[],skip:[]})});
  D.mig1=true;save()}

const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=n=>priv?"•••• €":(n||0).toLocaleString("es-ES",{style:"currency",currency:"EUR",useGrouping:"always"});
const fq=n=>(+n||0).toLocaleString("es-ES",{maximumFractionDigits:6});

/* ---------- FIFO engine (criterio FIFO de la normativa IRPF) ---------- */
function engine(){
  const lots={},sales=[],pos={},trs={};
  const ops=[...D.ops].sort((a,b)=>a.date.localeCompare(b.date)||(a.type==="buy"?-1:1));
  for(const o of ops){
    const k=o.asset+"|"+o.broker; lots[k]=lots[k]||[];
    if(o.type==="transfer"){let rem=+o.qty,cost=0;const k2=o.toAsset+"|"+o.toBroker;lots[k2]=lots[k2]||[];const ratio=+o.toQty/+o.qty;const mv=[];
      while(rem>1e-12&&lots[k].length){const l=lots[k][0];const t=Math.min(rem,l.q);const c=l.c*t/l.q;cost+=c;l.c-=c;l.q-=t;rem-=t;mv.push({q:t*ratio,c,date:l.date,id:l.id,tr:o.id});if(l.q<=1e-12)lots[k].shift()}
      lots[k2].push(...mv);lots[k2].sort((x,y)=>x.date.localeCompare(y.date));trs[o.id]={cost,short:rem>1e-9};continue}
    if(o.type==="buy"){lots[k].push({q:+o.qty,c:(+o.qty*+o.price)+(+o.fee||0),date:o.date,id:o.id})}
    else{
      let rem=+o.qty,cost=0;const used=[];
      while(rem>1e-12&&lots[k].length){const l=lots[k][0];const t=Math.min(rem,l.q);const c=l.c*t/l.q;cost+=c;l.c-=c;l.q-=t;rem-=t;used.push({date:l.date,q:t});if(l.q<=1e-12)lots[k].shift()}
      const proceeds=(+o.qty*+o.price)-(+o.fee||0);
      sales.push({...o,cost,proceeds,pl:proceeds-cost,used,short:rem>1e-9});
    }
  }
  for(const k in lots){const [asset,broker]=k.split("|");const q=lots[k].reduce((s,l)=>s+l.q,0);if(q<1e-6)continue;
    const c=lots[k].reduce((s,l)=>s+l.c,0);const a=A(asset);const v=q*(+a.price||0);
    pos[k]={asset,broker,q,cost:c,value:v,pl:v-c,avg:c/q}}
  // regla 2 meses (art. 33.5 LIRPF): pérdida con recompra homogénea 2 meses antes/después (12 meses si no cotiza)
  for(const s of sales){if(s.pl>=0)continue;const d=new Date(s.date);
    const win=(A(s.asset).type==="Fondo indexado"||A(s.asset).type==="Plan de pensiones")?12:2;
    const lo=new Date(d);lo.setMonth(lo.getMonth()-win);const hi=new Date(d);hi.setMonth(hi.getMonth()+win);
    s.wash=D.ops.some(o=>o.type==="buy"&&o.asset===s.asset&&o.id!==s.id&&new Date(o.date)>=lo&&new Date(o.date)<=hi&&o.date!==s.date);s.win=win}
  return{pos:Object.values(pos),sales,lots,trs}
}

/* ---------- Aportaciones automáticas ---------- */
function lastDay(y,m){return new Date(y,m+1,0).getDate()}
function runDate(day,y,m){return new Date(y,m,Math.min(day,lastDay(y,m)))}
function pendingRuns(){const out=[];const now=new Date();now.setHours(23,59,59);
  for(const p of D.plans){if(!p.active)continue;let start=new Date(p.start+"T00:00:00");let y=start.getFullYear(),m=start.getMonth();
    for(let i=0;i<240;i++){const d=runDate(+p.day,y,m);if(d>now)break;
      if(d>=start){const ds=d.toLocaleDateString("sv-SE");if(!(p.done||[]).includes(ds)&&!(p.skip||[]).includes(ds))out.push({plan:p,date:ds})}
      m+=+p.every||1;if(m>11){y+=Math.floor(m/12);m%=12}}}
  return out.sort((a,b)=>a.date.localeCompare(b.date))}
function nextRun(p){const now=new Date();let y=now.getFullYear(),m=now.getMonth();for(let i=0;i<24;i++){const d=runDate(+p.day,y,m);if(d>=new Date(p.start)&&d.toLocaleDateString("sv-SE")>=today())return d.toLocaleDateString("es-ES");m++;if(m>11){m=0;y++}}return"–"}

/* ---------- vistas ---------- */
function opts(arr,sel){return arr.map(x=>`<option ${x==sel?"selected":""}>${x}</option>`).join("")}
function assetOpts(sel){return D.assets.map(a=>`<option value="${a.id}" ${a.id==sel?"selected":""}>${a.name}${a.ticker?" ("+a.ticker+")":""}</option>`).join("")}
function totals(E){const inv=E.pos.reduce((s,p)=>s+p.cost,0),val=E.pos.reduce((s,p)=>s+p.value,0);
  const real=E.sales.reduce((s,x)=>s+x.pl,0),div=D.divs.reduce((s,d)=>s+(+d.gross||0),0),cash=Object.values(D.cash).reduce((s,c)=>s+(+c||0),0);return{inv,val,real,div,cash}}

function vDash(){const E=engine(),T=totals(E);const pend=pendingRuns();
  const byB={};E.pos.forEach(p=>byB[p.broker]=(byB[p.broker]||0)+p.cost);
  const byT={};E.pos.forEach(p=>{const t=A(p.asset).type||"Otro";byT[t]=(byT[t]||0)+p.cost});
  const bars=o=>{const tot=Object.values(o).reduce((a,b)=>a+b,0)||1;return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:6px 0"><div class="flex"><span>${k}</span><span>${fmt(v)} · ${(v/tot*100).toFixed(1)}%</span></div><div class="bar"><i style="width:${v/tot*100}%"></i></div></div>`).join("")||'<p class="mu">Sin posiciones todavía.</p>'};
  const bought=D.ops.filter(o=>o.type=="buy").reduce((s,o)=>s+amt(o),0),sold=D.ops.filter(o=>o.type=="sell").reduce((s,o)=>s+amt(o),0);
  const goal=D.goal>0?`<div class="card"><h2>${I("target")} Objetivo de inversión</h2><div class="flex"><span>${fmt(T.inv)} de ${fmt(D.goal)}</span><b>${(T.inv/D.goal*100).toFixed(1)}%</b></div><div class="bar"><i style="width:${Math.min(100,T.inv/D.goal*100)}%"></i></div></div>`:"";
  const bk=D.ops.length&&(!D.lastBackup||(Date.now()-new Date(D.lastBackup))/864e5>30);
  return `${bk?`<div class="card warn" style="font-size:14px">${I("alert")}<span style="flex:1">${D.lastBackup?"Hace más de un mes de tu última copia de seguridad.":"Aún no has hecho ninguna copia de seguridad."}</span> <button class="btn sm" onclick="backup()">Hacer copia</button></div>`:""}${pend.length?`<div class="card warn" style="font-size:14px">${I("repeat")}<span style="flex:1">Tienes <b>${pend.length}</b> aportación(es) automática(s) pendientes de confirmar.</span> <button class="btn sm" onclick="go('plans')">Revisar</button></div>`:""}
  <div class="kpis">
   <div class="kpi"><small>Invertido en posiciones abiertas</small><b>${fmt(T.inv)}</b></div>
   <div class="kpi"><small>Activos abiertos</small><b>${E.pos.length}</b></div>
   <div class="kpi"><small>Beneficio/pérdida realizado</small><b class="${cls(T.real)}">${fmt(T.real)}</b></div>
   <div class="kpi"><small>Dividendos brutos</small><b>${fmt(T.div)}</b></div>
  </div><br>${goal}
  <div class="card"><h2>${I("chart")} Dinero invertido en el tiempo</h2>${chart()}</div>
  <div class="card"><h2>Por plataforma</h2>${bars(byB)}</div>${contrib()}${feesCard()}
  <div class="card"><h2>Por tipo de activo</h2>${bars(byT)}</div>`}

let CH=[];
function investedAt(date){const keep=D.ops;D.ops=keep.filter(o=>o.date<=date);const c=engine().pos.reduce((s,p)=>s+p.cost,0);D.ops=keep;return c}
let cMode="m";
function newMoney(){const ops=[...D.ops].sort((a,b)=>a.date.localeCompare(b.date)||(a.type==="sell"?-1:1));let pool=0;const r={};
  for(const o of ops){if(o.type=="sell"){pool+=amt(o);continue}if(o.type!="buy")continue;const a=amt(o);let re=0;
    if(o.origin=="new")re=0;else if(o.origin=="reinv")re=a;else re=Math.min(pool,a);pool=Math.max(0,pool-re);r[o.id]={nw:a-re,re}}return r}
function contrib(){const NM=newMoney();const buys=D.ops.filter(o=>o.type=="buy"&&NM[o.id]);const reTot=buys.reduce((s,o)=>s+NM[o.id].re,0);if(!buys.length)return"";const m={},y={};buys.forEach(o=>{const n=NM[o.id].nw;if(n<0.005)return;m[o.date.slice(0,7)]=(m[o.date.slice(0,7)]||0)+n;y[o.date.slice(0,4)]=(y[o.date.slice(0,4)]||0)+n});if(!Object.keys(m).length)return"";
  const t=today();const last=[];let yy=+t.slice(0,4),mm=+t.slice(5,7)-1;for(let i=0;i<12;i++){last.unshift(`${yy}-${String(mm+1).padStart(2,"0")}`);mm--;if(mm<0){mm=11;yy--}}
  const mx=Math.max(...last.map(k=>m[k]||0))||1;const MES=["E","F","M","A","M","J","J","A","S","O","N","D"];
  const first=Object.keys(m).sort()[0];const nMonths=(+t.slice(0,4)-+first.slice(0,4))*12+(+t.slice(5,7)-+first.slice(5,7))+1;const tot=buys.reduce((s,o)=>s+NM[o.id].nw,0);
  return`<div class="card"><h2>${I("plus")} Aportaciones de dinero nuevo</h2><p class="mu">No cuenta el dinero de ventas que reinviertes ni los traspasos. Reinvertido hasta ahora: <b>${fmt(reTot)}</b>.</p>
  <div style="display:flex;align-items:flex-end;gap:4px;height:110px;margin:6px 0">${last.map(k=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%" title="${k}: ${fmt(m[k]||0)}" onclick="toast('${k.split("-").reverse().join("/")}: '+fmt(${m[k]||0}))"><div style="width:100%;background:var(--ac);border-radius:6px 6px 3px 3px;height:${(m[k]||0)/mx*90}%;min-height:${m[k]?3:0}px"></div><span class="mu" style="font-size:10px;margin-top:3px">${MES[+k.slice(5)-1]}</span></div>`).join("")}</div>

function chart(){const od=D.ops.map(o=>o.date).sort();if(!od.length)return'<p class="mu">Aparecerá cuando tengas operaciones.</p>';
  const ds=[];let y=+od[0].slice(0,4),m=+od[0].slice(5,7)-1;const tdy=today();
  while(true){const e=new Date(y,m+1,0).toLocaleDateString("sv-SE");const cur=e>=tdy;ds.push(cur?tdy:e);if(cur||ds.length>600)break;m++;if(m>11){m=0;y++}}

  const s=ds.map(d=>[d,investedAt(d)]);CH=s;
  const W=320,H=150,P=26;const vs=s.map(x=>x[1]);const mx=Math.max(...vs),mn=0;const r=mx-mn||1;
  const t0=new Date(s[0][0]).getTime(),t1=new Date(s[s.length-1][0]).getTime()||t0+1;
  const X=d=>P+(new Date(d).getTime()-t0)/((t1-t0)||1)*(W-P*2),Y=v=>H-P-(v-mn)/r*(H-P*2-10);
  const path=s.map((x,i)=>`${i?"L":"M"}${X(x[0]).toFixed(1)},${Y(x[1]).toFixed(1)}`).join("");
  const f=d=>d.split("-").reverse().join("/");
  return `<div style="position:relative"><svg id="chsvg" viewBox="0 0 ${W} ${H}" width="100%" style="touch-action:pan-y">

  <path d="${path}" stroke="#4c8dd6" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  ${s.map((x,i)=>`<circle cx="${X(x[0])}" cy="${Y(x[1])}" r="3" fill="#4c8dd6"/><circle cx="${X(x[0])}" cy="${Y(x[1])}" r="14" fill="transparent" style="cursor:pointer" onmouseenter="chTip(${i},${X(x[0])},${Y(x[1])})" onclick="chTip(${i},${X(x[0])},${Y(x[1])})"/>`).join("")}
  <circle id="chd" r="5.5" fill="#4c8dd6" stroke="#e6ebf2" stroke-width="2" visibility="hidden" pointer-events="none"/>
  <text x="${P}" y="${H-8}">${f(s[0][0]).slice(3)}</text><text x="${W-P}" y="${H-8}" text-anchor="end">${f(s[s.length-1][0]).slice(3)}</text><text x="2" y="12">${priv?"":Math.round(mx)+" €"}</text></svg>
  <div id="chtip" style="display:none;position:absolute;top:0;background:#1d2940;border:1px solid var(--bd);border-radius:12px;padding:6px 10px;font-size:12px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)"></div></div>
  <p class="mu">Dinero invertido en posiciones abiertas al final de cada mes (el último punto es hoy). Toca o pasa el cursor por un punto.</p>`}
function chTip(i,x,y){const [d,v]=CH[i];const t=document.getElementById("chtip"),svg=document.getElementById("chsvg");
  const k=svg.getBoundingClientRect().width/320;const mes=new Date(d+"T12:00").toLocaleDateString("es-ES",{month:"long",year:"numeric"});t.innerHTML=`<b>${fmt(v)}</b><br><span class="mu">${i==CH.length-1&&d==today()?"Hoy ("+new Date(d+"T12:00").toLocaleDateString("es-ES")+")":"Final de "+mes}</span>`;

function taxOf(b){let t=0,prev=0;for(const[l,r]of SCALE){if(b<=prev)break;t+=(Math.min(b,l)-prev)*r;prev=l}return t}
function vTax(){const E=engine();const years=[...new Set([...E.sales.map(s=>s.date.slice(0,4)),...D.divs.map(d=>d.date.slice(0,4)),String(new Date().getFullYear())])].sort().reverse();

function isNative(){return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}

    const w=await P.Filesystem.writeFile({path:name,data:b64,directory:"CACHE"});await P.Share.share({title:name,url:w.uri,dialogTitle:"Guardar o compartir "+name});return}catch(e){if(String(e&&e.message||e).toLowerCase().includes("cancel"))return;toast("No se pudo compartir el archivo");return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}

function sheetData(){const E=engine();const gen=[["Broker","Dinero invertido","Nº activos invertidos"]];let tot=0;const sheets=[];

    const ids=[...new Set(ops.flatMap(o=>o.type=="transfer"?[o.broker===b?o.asset:null,o.toBroker===b?o.toAsset:null].filter(Boolean):[o.asset]))];const open=E.pos.filter(p=>p.broker===b);const inv=open.reduce((s,p)=>s+p.cost,0);tot+=inv;
    gen.push([b,r2(inv),ids.length]);
    const L=[["Fecha","Activo","Transacción","Precio","Dinero invertido","Cantidad activo","Comisión","Nota"]].concat(ops.flatMap(o=>{const f=o.date.split("-").reverse().join("-");if(o.type=="transfer"){const c=r2((E.trs[o.id]||{}).cost||0);const r=[];if(o.broker===b)r.push([f,A(o.asset).name,"Traspaso salida","",c,+o.qty,0,"A "+A(o.toAsset).name]);if(o.toBroker===b)r.push([f,A(o.toAsset).name,"Traspaso entrada","",c,+o.toQty,0,"Desde "+A(o.asset).name]);return r}return[[f,A(o.asset).name,o.type=="buy"?"Compra":"Venta",+(+o.price).toFixed(6),r2(amt(o)),+o.qty,+o.fee||0,o.note||""]]}));

function crc32(b){let c,t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}c=-1;for(let i=0;i<b.length;i++)c=(c>>>8)^t[(c^b[i])&255];return(c^-1)>>>0}
function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=n=>[n&255,n>>8&255],u32=n=>[n&255,n>>8&255,n>>16&255,n>>>24&255];
  for(const[name,str]of files){const d=enc.encode(str),nm=enc.encode(name),cr=crc32(d);
    const h=[...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(cr),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)];
    parts.push(new Uint8Array(h),nm,d);
    cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(cr),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=h.length+nm.length+d.length}
  const cs=cen.reduce((s,x)=>s+x.length,0);const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...parts,...cen,end],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
function xlsx(){const sh=sheetData();const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const col=i=>{let s="";i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  const sx=rows=>`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="20" width="18" customWidth="1"/></cols><sheetData>${rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>v===""?"":typeof v==="number"?`<c r="${col(ci)}${ri+1}"${ri==0?' s="1"':""}><v>${v}</v></c>`:`<c r="${col(ci)}${ri+1}" t="inlineStr"${ri==0?' s="1"':""}><is><t>${esc(v)}</t></is></c>`).join("")}</row>`).join("")}</sheetData></worksheet>`;
  const files=[["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sh.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
   ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
   ["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sh.map((s,i)=>`<sheet name="${esc(s[0])}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`],
   ["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sh.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sh.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
   ["xl/styles.xml",`<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf/><xf fontId="1" applyFont="1"/></cellXfs></styleSheet>`],
   ...sh.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sx(s[1])])];
  saveBlob("inversiones_"+today()+".xlsx",zip(files))}

function parseCsv(t){t=t.replace(/^\ufeff/,"");const first=t.split(/\r?\n/)[0];const del=[";",",","\t"].sort((a,b)=>first.split(b).length-first.split(a).length)[0];const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==del){r.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);f="";if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}
  r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows}
const IMF=[["date","Fecha",["fecha","date","datum","time"]],["asset","Activo (nombre)",["activo","nombre","name","instrument","description","descripción","producto","symbol","ticker"]],["isin","ISIN (opcional)",["isin"]],["type","Compra/Venta",["transacción","transaccion","tipo","type","side","operación","operacion"]],["qty","Cantidad",["cantidad","quantity","qty","shares","participaciones","titulos","títulos"]],["price","Precio (opcional)",["precio","price"]],["amount","Importe (opcional)",["dinero invertido","importe","amount","total","value"]],["fee","Comisión (opcional)",["comisión","comision","fee","fees","commission"]],["plat","Plataforma (opcional)",["plataforma","broker"]]];
function impCsv(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const rows=parseCsv(r.result);if(rows.length<2)return toast("CSV vacío");imp0=rows;const h=rows[0];
  const guess=keys=>{const i=h.findIndex(x=>keys.some(k=>x.trim().toLowerCase()==k));if(i>=0)return i;return h.findIndex(x=>keys.some(k=>x.trim().toLowerCase().includes(k)))};
  document.getElementById("imOut").innerHTML=`<p class="mu">${rows.length-1} filas detectadas. Revisa las columnas:</p>${IMF.map(([k,l,keys])=>`<label>${l}</label><select id="im_${k}"><option value="-1">— ninguna —</option>${h.map((x,i)=>`<option value="${i}" ${guess(keys)==i?"selected":""}>${x||"(col "+(i+1)+")"}</option>`).join("")}</select>`).join("")}
  <label>Formato de fecha</label><select id="im_df"><option value="auto">Automático</option><option value="dmy">Día-mes-año</option><option value="ymd">Año-mes-día</option><option value="mdy">Mes-día-año</option></select>
  <label>Moneda de precios e importes</label><select id="im_cur"><option value="EUR">Euros</option><option value="USD">Dólares</option></select><div id="im_fxw"><label>Si son dólares, tipo de cambio ($ por 1 €)</label><input type="number" step="any" id="im_fx"></div>
  <button class="btn" onclick="impRun()">${I("upload",14)} Importar</button>`};r.readAsText(f)}
function pDate(x,fm){x=x.trim().slice(0,10).replace(/[./]/g,"-");let p=x.split("-");if(p.length<3)return null;if(p[0].length==4)return`${p[0]}-${p[1].padStart(2,"0")}-${p[2].padStart(2,"0")}`;
  let d=p[0],m=p[1],y=p[2];if(fm=="mdy")[d,m]=[m,d];if(y.length==2)y="20"+y;return`${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`}
function pNum(x){if(x==null)return NaN;x=String(x).replace(/[€$\s]/g,"");if(x.includes(",")&&x.includes("."))x=x.lastIndexOf(",")>x.lastIndexOf(".")?x.replace(/\./g,"").replace(",","."):x.replace(/,/g,"");else x=x.replace(",",".");return parseFloat(x)}
function impRun(){const rows=imp0;const g=k=>+v("im_"+k);const fm=v("im_df"),usd=v("im_cur")=="USD",fx=+v("im_fx");if(usd&&!fx)return toast("Indica el tipo de cambio");
  if(g("date")<0||g("asset")<0&&g("isin")<0||g("qty")<0)return toast("Faltan columnas: fecha, activo y cantidad");let n=0,skip=0;const B=v("imB");
  for(const r of rows.slice(1)){const date=pDate(r[g("date")]||"",fm);let q=Math.abs(pNum(r[g("qty")]));const name=(g("asset")>=0?r[g("asset")]:"").trim(),isin=(g("isin")>=0?r[g("isin")]:"").trim();
    const tt=(g("type")>=0?r[g("type")]:"").toLowerCase();let type=/vent|sell|verk|sale/.test(tt)?"sell":/compr|buy|kauf|purchase|savings|ahorro/.test(tt)?"buy":(pNum(r[g("qty")])<0?"sell":g("type")<0?"buy":null);
    let pr=g("price")>=0?Math.abs(pNum(r[g("price")])):NaN,am=g("amount")>=0?Math.abs(pNum(r[g("amount")])):NaN,fee=g("fee")>=0?Math.abs(pNum(r[g("fee")]))||0:0;
    if(!date||!q||!type||(!name&&!isin)){skip++;continue}if(usd){pr/=fx;am/=fx;fee/=fx}
    if(!isFinite(pr)||!pr)pr=type=="buy"?(am-fee)/q:am/q;if(!isFinite(pr)||!pr){skip++;continue}
    let a=D.assets.find(x=>(isin&&x.isin==isin)||(name&&x.name.toLowerCase()==name.toLowerCase()));if(!a){a={id:uid(),name:name||isin,ticker:"",isin,type:"Otro",price:0,tags:[]};D.assets.push(a)}
    const plat=g("plat")>=0&&BROKERS.includes((r[g("plat")]||"").trim())?r[g("plat")].trim():B;
    if(D.ops.some(o=>o.date==date&&o.asset==a.id&&o.broker==plat&&Math.abs(o.qty-q)<1e-9&&o.type==type)){skip++;continue}
    D.ops.push({id:uid(),type,date,broker:plat,asset:a.id,qty:q,price:pr,fee,note:"Importado CSV",...(usd?{cur:"USD",fx}:{})});n++}
  save();toast(n+" importadas");document.getElementById("imOut").innerHTML=`<p>${n} operaciones importadas · ${skip} filas omitidas (vacías, no reconocidas o duplicadas).</p><p class="mu">Los activos nuevos se crean con tipo "Otro": cámbialo en Cartera › Activos.</p>`}

function addBroker(){const n=v("newB").trim();if(!n)return toast("Escribe un nombre");if(BROKERS.some(b=>b.toLowerCase()==n.toLowerCase()))return toast("Ya existe");setBrokers([...BROKERS,n]);toast("Plataforma añadida")}
function delBroker(i){const b=BROKERS[i];if(D.ops.some(o=>o.broker===b||o.toBroker===b)||D.plans.some(p=>p.broker===b))return toast("Tiene operaciones: no se puede quitar");setBrokers(BROKERS.filter(x=>x!==b));toast("Plataforma quitada")}
function renBroker(i){const b=BROKERS[i];document.getElementById("renBox").innerHTML=`<label>Nuevo nombre para ${b}</label><div class="flex"><input id="renB" value="${b}"><button class="btn sm" style="margin-top:0" onclick="doRen(${i})">${I("check",14)} Guardar</button></div>`;document.getElementById("renB").focus()}
function doRen(i){const b=BROKERS[i],n=v("renB").trim();if(!n||n==b)return render();if(BROKERS.some(x=>x.toLowerCase()==n.toLowerCase()&&x!==b))return toast("Ya existe");
  D.ops.forEach(o=>{if(o.broker===b)o.broker=n;if(o.toBroker===b)o.toBroker=n});D.divs.forEach(d=>{if(d.broker===b)d.broker=n});D.plans.forEach(p=>{if(p.broker===b)p.broker=n});if(D.cash&&D.cash[b]!=null){D.cash[n]=D.cash[b];delete D.cash[b]}
  if(posFilter===b)posFilter=n;if(opFilter===b)opFilter=n;setBrokers(BROKERS.map(x=>x===b?n:x));toast("Renombrada")}

  <div class="card"><h2>Historial del activo</h2>${ops.map(o=>o.type=="transfer"?`<div class="item"><div class="flex"><span><span class="tag">TRASPASO ${o.asset===curAsset?"SALIDA":"ENTRADA"}</span>${new Date(o.date).toLocaleDateString("es-ES")}</span><b>${fmt((E.trs[o.id]||{}).cost||0)}</b></div><div class="mu">${o.asset===curAsset?"A "+A(o.toAsset).name+" · "+fq(o.qty)+" uds":"Desde "+A(o.asset).name+" · "+fq(o.toQty)+" uds"}</div></div>`:`<div class="item"><div class="flex"><span><span class="tag ${o.type=="buy"?"buy":"sell"}">${o.type=="buy"?"COMPRA":"VENTA"}</span>${new Date(o.date).toLocaleDateString("es-ES")}</span><span><b>${fmt(amt(o))}</b> <button class="btn sm sec" onclick="editOp('${o.id}')">${I("edit",14)}</button></span></div><div class="mu">${o.broker} · ${fq(o.qty)} × ${fmt(+o.price)} ${o.note?"· "+o.note:""}</div></div>`).join("")||'<p class="mu">Sin operaciones.</p>'}</div>`}
function simYears(n){const d=new Date();d.setFullYear(d.getFullYear()+n);document.getElementById("simD").value=d.toLocaleDateString("sv-SE");simRun()}
function simRun(){const p=+v("simP"),d=v("simD")||today();const a=A(curAsset);a.simPrice=p||"";a.simDate=d;save();const out=document.getElementById("simOut");if(!p){out.innerHTML="";return}
  const L=lotsOf(curAsset);let tc=0,tv=0;const rows=L.map(l=>{const val=l.q*p,g=val-l.c,y=yrs(l.date,d);tc+=l.c;tv+=val;const cagr=y>0.08?(Math.pow(val/l.c,1/y)-1)*100:NaN;
    return`<tr><td>${new Date(l.date).toLocaleDateString("es-ES")}<br><span class="mu">${l.broker.split(" ")[0]} · ${y.toFixed(1)} años</span></td><td>${fmt(l.c)}</td><td>${fmt(val)}</td><td class="${cls(g)}">${fmt(g)}<br><span style="font-size:11px">${pct(g/l.c*100)}${isFinite(cagr)?" · "+pct(cagr).replace(" %","%")+"/año":""}</span></td></tr>`}).join("");
  out.innerHTML=`<div class="kpis" style="margin:10px 0"><div class="kpi"><small>Valor a ${new Date(d).toLocaleDateString("es-ES")}</small><b>${fmt(tv)}</b></div><div class="kpi"><small>Ganancia total</small><b class="${cls(tv-tc)}">${fmt(tv-tc)}</b><span class="${cls(tv-tc)}" style="font-size:12px">${pct((tv-tc)/tc*100)}</span></div></div>
  <table><tr><th>Aportación</th><th>Coste</th><th>Valor</th><th>Ganancia</th></tr>${rows}</table><p class="mu">Simulación con el precio que escribes; no es una previsión. No incluye impuestos.</p>`}
function sellSim(){const out=document.getElementById("svOut");const b=v("svB"),q=+v("svQ"),p=+v("svP"),d=v("svD")||today();if(!q||!p){out.innerHTML="";return}
  const L=lotsOf(curAsset).filter(l=>l.broker===b);const have=L.reduce((s,l)=>s+l.q,0);let rem=q,cost=0;const used=[];
  for(const l of L){if(rem<=1e-12)break;const t=Math.min(rem,l.q);const c=l.c*t/l.q;cost+=c;rem-=t;used.push({date:l.date,q:t,c})}
  const proc=q*p,pl=proc-cost;const a=A(curAsset);const win=(a.type=="Fondo indexado"||a.type=="Plan de pensiones")?12:2;
  const lo=new Date(d);lo.setMonth(lo.getMonth()-win);const hi=new Date(d);hi.setMonth(hi.getMonth()+win);
  const recent=D.ops.filter(o=>o.type=="buy"&&o.asset===curAsset&&new Date(o.date)>=lo&&new Date(o.date)<=new Date(d));const plan=D.plans.some(x=>x.active&&x.asset===curAsset);
  out.innerHTML=`${rem>1e-9?`<div class="warn">${I("alert")} Solo tienes ${fq(have)} participaciones en ${b}.</div>`:""}
  <div class="kpis" style="margin:10px 0"><div class="kpi"><small>Valor de transmisión</small><b>${fmt(proc)}</b></div><div class="kpi"><small>Valor de adquisición (FIFO)</small><b>${fmt(cost)}</b></div>
  <div class="kpi"><small>Ganancia/pérdida</small><b class="${cls(pl)}">${fmt(pl)}</b></div><div class="kpi"><small>Impuesto orientativo</small><b>${pl>0?fmt(taxOf(pl)):"0,00 €"}</b></div></div>
  <table><tr><th>Compra que se vende</th><th>Uds</th><th>Coste</th></tr>${used.map(u=>`<tr><td>${new Date(u.date).toLocaleDateString("es-ES")}</td><td>${fq(u.q)}</td><td>${fmt(u.c)}</td></tr>`).join("")}</table>
  ${pl<0&&(recent.length||plan)?`<div class="warn">${I("alert")} Si vendes con pérdidas y has comprado este activo en los ${win} meses anteriores${plan?" (o tienes una aportación automática activa que comprará en los "+win+" meses siguientes)":""}, esa pérdida podría no computar este año.</div>`:""}
  <p class="mu">El impuesto se estima como si esta fuera tu única ganancia del año (19 % hasta 6.000 €…).</p>`}
function go(x){view=x;render()}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==(view=="asset"?"pos":view)));
  const V={dash:vDash,pos:vPos,ops:vOps,plans:vPlans,tax:vTax,cfg:vCfg,asset:vAsset};document.getElementById("main").innerHTML=V[view]();window.scrollTo(0,0);if(view=="asset"&&document.getElementById("simP")&&v("simP"))simRun()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=I(e.dataset.i,20));document.getElementById("hd").innerHTML=I("chart",18)+" Mis Inversiones";document.getElementById("privBtn").innerHTML=I("eye",16);
migrate();render();
</script></body></html>
